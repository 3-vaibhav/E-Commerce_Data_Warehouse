
services:
  postgres:
    image: postgres:16
    container_name: ecommerce_warehouse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce_warehouse
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - ecommerce_warehouse_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d ecommerce_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ecommerce_warehouse_data:
